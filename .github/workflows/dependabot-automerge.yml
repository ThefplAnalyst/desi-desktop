# Auto-merge for Dependabot (spec 7.4): only patch updates of development dependencies, and only after
# the required checks pass (GitHub's auto-merge waits for them). Everything else waits for the owner.
# Needs the repository setting "Allow auto-merge" (owner turns it on once).
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'ThefplAnalyst/desi-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.dependency-type == 'direct:development' && steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
